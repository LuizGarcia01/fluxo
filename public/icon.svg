<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" ry="112" fill="#7ab4ad"/>
  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8cc4bd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d8a84;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>

  <!-- TrendingUp icon — centered, white -->
  <!-- Line: from (80,340) → (192,228) → (304,290) → (432,144) -->
  <polyline
    points="80,340 192,228 304,290 432,144"
    fill="none"
    stroke="white"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />
  <!-- Arrow head tip at (432,144) -->
  <!-- Arrow right: (304,144) → (432,144) → (432,272) -->
  <polyline
    points="304,144 432,144 432,272"
    fill="none"
    stroke="white"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />
</svg>
